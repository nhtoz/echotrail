[project]
name = "flightrec"
version = "0.6.0"
description = "Flight recorder & forensics for AI agents — tamper-evident traces, replay, injection highlighting"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anchor = ["rfc3161ng>=2.1"]

[project.scripts]
flightrec = "flightrec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flightrec*"]
