[project]
name = "wakeprint"
version = "0.14.1"
description = "Flight recorder & forensics for AI agents — tamper-evident traces, replay, injection highlighting"
readme = "README.md"
license = "MIT"
authors = [{name = "Nihat Öz", email = "nihatoz@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/nhtoz/wakeprint"
Repository = "https://github.com/nhtoz/wakeprint"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anchor = ["rfc3161ng>=2.1"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
wakeprint = "wakeprint.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wakeprint*"]

[tool.pytest.ini_options]
# e2e/ tests the PyPI release and needs extra packages; run it from e2e/
testpaths = ["tests"]
